    <!--
      Both faces are used above the fold, and the labels inside the 3D world
      are drawn into canvases from them — a late font would be baked into a
      texture that is never regenerated. See src/main.tsx.
    -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ibroximjon",
        "url": "https://ibroximjon.uz/",
        "jobTitle": "Software Engineer",
        "description": "Software engineer building digital products, web applications, systems, APIs, automation and interactive experiences.",
        "knowsAbout": [
          "JavaScript", "TypeScript", "React", "Vue", "Three.js",
          "Node.js", "Express.js", "REST API",
          "MongoDB", "PostgreSQL", "SQLite",

          "Telegram Bots", "OpenAI API", "Automation", "PWA","AWS", "Cloud Services", "Web Development", "Software Engineering"
        ],
        "sameAs": ["https://t.me/pymuhandis", "https://github.com/umid-weeb"]
      }
    </script>

    <!--
      An earlier build of this site registered a service worker. Anyone who
      visited it still has one and would keep being served that build from
      cache. This unregisters it once, and can be removed after the new site
      has been live long enough for returning visitors to land.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) registration.unregister()
        })
      }
    </script>
